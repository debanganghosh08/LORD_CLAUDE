[project]
name = "lord-harness"
version = "0.1.0"
description = "LORD: a portable, model-agnostic senior-engineer harness for IDE coding agents."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
# LORD core deliberately has ZERO runtime dependencies. It must never require
# a model provider SDK or an API key. See docs/ARCHITECTURE.md.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
lord = "lord.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["lord*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --ignore=tests/fixtures"
